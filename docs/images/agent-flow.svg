<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Agent flow: from a match event to the viewer's ears</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #475569; }
      .chip { font-size: 11px; font-weight: 600; }
      .label { font-size: 12px; font-weight: 600; fill: #475569; }
      .band-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      .step { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2; }
      .flow-blue { fill: none; stroke: #3b82f6; stroke-width: 2; }
      .context { fill: none; stroke: #d97706; stroke-width: 2; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="900" height="1010" fill="#ffffff"/>

  <!-- ===== Shared context (left) ===== -->
  <rect x="32" y="112" width="250" height="214" rx="16" fill="#fffbeb" stroke="#f2d27a" stroke-width="1.5"/>
  <text x="52" y="138" class="band-label" fill="#b45309">Shared context</text>
  <g filter="url(#shadow)">
    <rect x="50" y="152" width="214" height="66" rx="12" fill="#f1f4f8" stroke="#c3cbd6"/>
    <rect x="50" y="234" width="214" height="74" rx="12" fill="#eaf2ff" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="66" y="179" class="title">👤 Viewer Profile</text>
  <text x="66" y="201" class="sub">level · language · already explained</text>
  <text x="66" y="261" class="title">📖 Storyteller</text>
  <text x="66" y="283" class="sub">match story so far, recaps</text>
  <rect x="210" y="246" width="40" height="18" rx="9" fill="#3b82f6"/><text x="230" y="259" class="chip" fill="#fff" text-anchor="middle">AI</text>

  <!-- ===== Main pipeline (centre) ===== -->
  <g filter="url(#shadow)">
    <rect x="345" y="28" width="210" height="58" rx="29" fill="#f1f4f8" stroke="#c3cbd6"/>
    <rect x="330" y="122" width="240" height="64" rx="12" fill="#f1f4f8" stroke="#c3cbd6"/>
    <rect x="330" y="218" width="240" height="64" rx="12" fill="#f1f4f8" stroke="#c3cbd6"/>
    <rect x="290" y="316" width="320" height="78" rx="14" fill="#1e293b"/>
  </g>
  <text x="450" y="54" class="title" text-anchor="middle">📡 Match feed</text>
  <text x="450" y="73" class="sub" text-anchor="middle">events arrive live</text>

  <text x="450" y="149" class="title" text-anchor="middle">🧮 Stats Engine</text>
  <text x="450" y="171" class="sub" text-anchor="middle">xG · momentum · possession · tempo</text>

  <text x="450" y="245" class="title" text-anchor="middle">🎯 Moment Ranker</text>
  <text x="450" y="267" class="sub" text-anchor="middle">how interesting is this? 0–10</text>

  <text x="450" y="347" class="title" text-anchor="middle" fill="#ffffff" style="fill:#ffffff">🎬 Producer</text>
  <text x="450" y="371" class="sub" text-anchor="middle" style="fill:#cbd5e1">who speaks · when · what to drop</text>

  <path class="flow" d="M450,86 V118" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,186 V214" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,282 V312" marker-end="url(#arrow)"/>

  <!-- step badges -->
  <circle cx="318" cy="57" r="13" fill="#0f172a"/><text x="318" y="61" class="step" text-anchor="middle">1</text>
  <circle cx="303" cy="154" r="13" fill="#0f172a"/><text x="303" y="158" class="step" text-anchor="middle">2</text>
  <circle cx="303" cy="250" r="13" fill="#0f172a"/><text x="303" y="254" class="step" text-anchor="middle">3</text>

  <!-- ===== Viewer question (right) ===== -->
  <g filter="url(#shadow)">
    <rect x="668" y="326" width="196" height="58" rx="29" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  </g>
  <text x="766" y="352" class="title" text-anchor="middle">🎤 Viewer asks</text>
  <text x="766" y="371" class="sub" text-anchor="middle">"why was that a foul?"</text>
  <path class="flow" d="M668,355 H616" marker-end="url(#arrow)"/>

  <!-- ===== AI agents band ===== -->
  <rect x="32" y="440" width="836" height="170" rx="18" fill="#f5f9ff" stroke="#bfd7ff" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="52" y="465" class="band-label" fill="#1d4ed8">AI agents · Microsoft Foundry</text>

  <!-- Producer branches -->
  <path class="flow" d="M450,394 V418 H170 V486" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,394 V486" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,418 H730 V486" marker-end="url(#arrow)"/>
  <circle cx="450" cy="418" r="4" fill="#64748b"/>
  <text x="180" y="410" class="label">live action</text>
  <text x="458" y="433" class="label">quiet moment</text>
  <text x="740" y="410" class="label">question</text>
  <circle cx="272" cy="403" r="13" fill="#0f172a"/><text x="272" y="407" class="step" text-anchor="middle">4</text>

  <g filter="url(#shadow)">
    <rect x="66" y="486" width="208" height="104" rx="12" fill="#eaf2ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="346" y="486" width="208" height="104" rx="12" fill="#eaf2ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="626" y="486" width="208" height="104" rx="12" fill="#eaf2ff" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="170" y="515" class="title" text-anchor="middle">🎙️ Caller</text>
  <text x="170" y="537" class="sub" text-anchor="middle">what's happening, now</text>
  <rect x="104" y="554" width="132" height="22" rx="11" fill="#dbeafe"/><text x="170" y="569" class="chip" fill="#1d4ed8" text-anchor="middle">no tools · under 1 s</text>

  <text x="450" y="515" class="title" text-anchor="middle">🧠 Analyst</text>
  <text x="450" y="537" class="sub" text-anchor="middle">why it mattered</text>
  <rect x="376" y="554" width="148" height="22" rx="11" fill="#dbeafe"/><text x="450" y="569" class="chip" fill="#1d4ed8" text-anchor="middle">calls stats tools</text>

  <text x="730" y="515" class="title" text-anchor="middle">❓ Q&amp;A</text>
  <text x="730" y="537" class="sub" text-anchor="middle">answers the viewer</text>
  <rect x="650" y="554" width="160" height="22" rx="11" fill="#dbeafe"/><text x="730" y="569" class="chip" fill="#1d4ed8" text-anchor="middle">events · stats · rules</text>

  <!-- context into agents -->
  <path class="context" d="M157,326 V436" marker-end="url(#arrow-amber)"/>
  <text x="166" y="382" class="label" style="fill:#b45309">level, story</text>

  <!-- ===== Fact-Checker ===== -->
  <path class="flow-blue" d="M450,590 V626 H560 V652" marker-end="url(#arrow-blue)"/>
  <path class="flow-blue" d="M730,590 V626 H620 V652" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="490" y="652" width="200" height="64" rx="12" fill="#eaf2ff" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="590" y="679" class="title" text-anchor="middle">✅ Fact-Checker</text>
  <text x="590" y="700" class="sub" text-anchor="middle">every number verified</text>
  <circle cx="476" cy="684" r="13" fill="#0f172a"/><text x="476" y="688" class="step" text-anchor="middle">5</text>
  <path class="flow" d="M690,684 H738" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="746" y="680" class="label" style="fill:#dc2626">✗ wrong number</text>
  <text x="746" y="696" class="sub">dropped or rewritten</text>

  <!-- ===== Voice ===== -->
  <path class="flow" d="M590,716 V762" marker-end="url(#arrow)"/>
  <text x="598" y="744" class="label">verified</text>
  <path class="flow" d="M170,590 V794 H296" marker-end="url(#arrow)"/>
  <path class="context" d="M50,286 H24 V818 H296" marker-end="url(#arrow-amber)"/>
  <text x="36" y="700" class="label" style="fill:#b45309" transform="rotate(-90 36 700)">half-time &amp; full-time recaps</text>
  <g filter="url(#shadow)">
    <rect x="300" y="762" width="300" height="76" rx="14" fill="#f1f4f8" stroke="#c3cbd6"/>
  </g>
  <text x="450" y="792" class="title" text-anchor="middle">🔊 Voice</text>
  <text x="450" y="815" class="sub" text-anchor="middle">Guy &amp; Sonia · crowd · priority queue</text>
  <circle cx="286" cy="772" r="13" fill="#0f172a"/><text x="286" y="776" class="step" text-anchor="middle">6</text>

  <!-- ===== Viewer ===== -->
  <path class="flow" d="M450,838 V868" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <circle cx="450" cy="910" r="40" fill="#fff1e6" stroke="#f97316" stroke-width="1.5"/>
  </g>
  <text x="450" y="906" font-size="22" text-anchor="middle">📺</text>
  <text x="450" y="928" class="chip" fill="#9a3412" text-anchor="middle">Viewer</text>

  <!-- ===== Legend ===== -->
  <rect x="610" y="880" width="18" height="14" rx="4" fill="#f1f4f8" stroke="#c3cbd6"/><text x="636" y="892" class="sub">code: fast, exact</text>
  <rect x="610" y="904" width="18" height="14" rx="4" fill="#eaf2ff" stroke="#3b82f6"/><text x="636" y="916" class="sub">AI agent: writes words</text>
  <path d="M610,935 H628" class="context"/><text x="636" y="940" class="sub">shared context</text>
  <circle cx="619" cy="960" r="9" fill="#0f172a"/><text x="619" y="964" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="636" y="964" class="sub">steps, explained below</text>
</svg>
